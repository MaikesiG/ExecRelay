[package]
name = "tracerelay"
version = "0.2.0"
description = "A local-first AI-native terminal that turns runtime output into safe, structured AI context."
authors = ["Xingchi Guo"]
edition = "2021"
rust-version = "1.85"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["wry"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
tauri-plugin-dialog = "~2.7"

[dev-dependencies]
serde_json = "1.0"
